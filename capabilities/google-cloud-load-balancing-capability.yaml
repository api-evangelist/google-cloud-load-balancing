      call: google-cloud-load-balancing.deletebackendservice
      with:
        project: tools.project
        backendService: tools.backendService
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: backendService
        type: string
        description: backendService
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listhealthchecks
      description: Google Cloud Load Balancing List health checks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-load-balancing.listhealthchecks
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listforwardingrules
      description: Google Cloud Load Balancing List forwarding rules
      hints:
        readOnly: true
